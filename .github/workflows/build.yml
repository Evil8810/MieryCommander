name: Build

# Builds and tests MieryCommander on macOS and Linux:
# - macOS: .dmg (universal: Intel + Apple Silicon)
# - Linux: AppImage + tar.gz (built on an older Ubuntu so it runs on most distributions)
# - Windows: .zip with miery_commander.exe
# A tag like "v0.1.0" also publishes everything on the GitHub release page.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # only used to attach the downloads to a release on tags

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test

      - name: App + DMG bauen / build app + dmg
        run: ./install-macos.sh --universal --dmg --no-install

      - name: Bundle prüfen / check bundle
        run: |
          app=target/macos/MieryCommander.app
          test -x "$app/Contents/MacOS/miery_commander"
          test -f "$app/Contents/Resources/AppIcon.icns"
          plutil -lint "$app/Contents/Info.plist"
          lipo -archs "$app/Contents/MacOS/miery_commander"
          codesign --verify --verbose "$app"
          ls -lh target/macos/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: MieryCommander-macos
          path: target/macos/*.dmg

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Pakete / packages
        run: |
          sudo apt-get update
          # mesa-vulkan-drivers: software GPU for the UI tests; Noto fonts: font fallback test;
          # file/desktop-file-utils: package checks
          sudo apt-get install -y mesa-vulkan-drivers libxkbcommon-dev libwayland-dev fontconfig \
            fonts-noto-core fonts-noto-cjk file desktop-file-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test

      - name: AppImage + tar.gz bauen / build
        run: ./package-linux.sh

      - name: Pakete prüfen / check packages
        run: |
          cd target/linux
          ls -lh
          file *.AppImage | grep -q executable
          chmod +x *.AppImage
          ./*.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/miery_commander
          desktop-file-validate squashfs-root/miery-commander.desktop
          rm -rf squashfs-root
          tar -tzf *.tar.gz | grep -q '/miery_commander$'

      - uses: actions/upload-artifact@v4
        with:
          name: MieryCommander-linux
          path: |
            target/linux/*.AppImage
            target/linux/*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test

      - name: Programm bauen / build
        run: cargo build --release

      - name: ZIP packen / pack zip
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $dir = "target/windows/MieryCommander"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item target/release/miery_commander.exe, README.md, LICENSE -Destination $dir
          Compress-Archive -Path $dir -DestinationPath "target/windows/MieryCommander-$version-windows-x86_64.zip" -Force
          Get-ChildItem target/windows

      - uses: actions/upload-artifact@v4
        with:
          name: MieryCommander-windows
          path: target/windows/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
