[package]
name = "miery_commander"
version = "0.1.1"
edition = "2024"

[dependencies]
bzip2 = "0.6.1"
chrono = "0.4.45"
dirs = "7.0.0"
eframe = { version = "0.36.2", features = ["persistence"] }
egui_extras = { version = "0.36.2", features = ["all_loaders"] }
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
keyring = "4.2.0"
libc = "0.2.190"
lzma-rust2 = "0.16.5"
open = "5.4.4"
regex = "1.13.1"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sevenz-rust2 = "0.23.0"
similar = { version = "3.2.0", features = ["inline"] }
suppaftp = { version = "12.1.1", features = ["deprecated", "rustls-ring"] }
sys-locale = "0.3.2"
tar = "0.4.46"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "io-util", "fs"] }
trash = "5.2.9"
unrar = "0.5.8"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "json"] }
webpki-roots = "1.0.9"
zip = "8.6.0"
zstd = "0.13"

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["eframe", "snapshot", "wgpu"] }
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "thin"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", features = ["blocking-api"] }
